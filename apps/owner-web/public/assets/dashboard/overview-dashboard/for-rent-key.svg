<svg xmlns="http://www.w3.org/2000/svg" width="128" height="128" viewBox="0 0 128 128" role="img" aria-labelledby="title desc">
  <title id="title">For rent — key</title>
  <desc id="desc">A soft silver-white diagonal door key with a circular head and a navy keyhole, matching the Westayplace rental icon.</desc>
  <defs>
    <linearGradient id="metal" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFFFFF"/>
      <stop offset=".30" stop-color="#F8FCFF"/>
      <stop offset=".66" stop-color="#C9D9EB"/>
      <stop offset="1" stop-color="#839BB6"/>
    </linearGradient>
    <linearGradient id="shaft" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#FFFFFF"/>
      <stop offset=".5" stop-color="#F3F8FF"/>
      <stop offset="1" stop-color="#B6C8DB"/>
    </linearGradient>
    <linearGradient id="edge" x1="0" y1="0" x2="0" y2="1">
      <stop stop-color="#E5F0FC"/>
      <stop offset="1" stop-color="#657E9B"/>
    </linearGradient>
    <radialGradient id="ring" cx=".32" cy=".22" r=".85">
      <stop stop-color="#FFFFFF"/>
      <stop offset=".55" stop-color="#F0F7FD"/>
      <stop offset=".85" stop-color="#D5E3EF"/>
      <stop offset="1" stop-color="#92A8BF"/>
    </radialGradient>
    <linearGradient id="hole" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#0A2658"/>
      <stop offset="1" stop-color="#183F70"/>
    </linearGradient>
    <filter id="softShadow" x="-35%" y="-35%" width="180%" height="185%">
      <feGaussianBlur in="SourceAlpha" stdDeviation="3.5" result="blur"/>
      <feOffset dx="1.5" dy="4" result="offset"/>
      <feComponentTransfer in="offset" result="alpha"><feFuncA type="linear" slope=".33"/></feComponentTransfer>
      <feMerge><feMergeNode in="alpha"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <!-- Solid, vector-only silhouette. Key points southwest, bow northeast. -->
  <g filter="url(#softShadow)">
    <!-- Shaft and teeth: contiguous, subtly edged metal -->
    <path d="M77.9 47.7 17.2 108.5a6.2 6.2 0 0 1-4.4 1.8H7.9a4.8 4.8 0 0 1-4.8-4.8v-8.9c0-1.5.6-2.9 1.6-3.9L65.7 31.6Z" fill="url(#edge)"/>
    <path d="M76.9 47.1 20 104.1H9.1V97l56.8-56.8Z" fill="url(#shaft)"/>
    <path d="M35.1 77.8 47 89.6l-6.3 6.4-12-2.7-6.6 6.7-11.1-11.1Z" fill="url(#metal)"/>
    <path d="M24.5 89.5 39.1 74.9l8.6 8.5-6.4 6.4-9.3-1.9-6 6Z" fill="#DCE8F5"/>
    <path d="M10.2 95.7 62.3 43.5" stroke="#FFFFFF" stroke-width="2.8" stroke-linecap="round" opacity=".87"/>
    <!-- Round key bow -->
    <circle cx="85" cy="43" r="37" fill="url(#ring)"/>
    <circle cx="85" cy="43" r="35" fill="none" stroke="#F9FCFF" stroke-width="2.4" opacity=".9"/>
    <circle cx="85" cy="43" r="10.2" fill="url(#hole)"/>
    <circle cx="82.6" cy="40.6" r="5" fill="#355A8A" opacity=".42"/>
  </g>
</svg>
