name: customer_app
description: "Westayplace — Customer app. Discover, tour, book, apply."
publish_to: 'none'
version: 0.1.0+1

environment:
  sdk: ">=3.5.4 <4.0.0"
  flutter: ">=3.24.5 <4.0.0"

dependencies:
  flutter:
    sdk: flutter

  flutter_riverpod: 2.5.1
  go_router: 14.2.7
  intl: 0.19.0
  http: 1.2.2
  cupertino_icons: 1.0.8
  supabase_flutter: 2.15.4
  geolocator: 14.0.2
  webview_flutter: 4.14.1
  shared_preferences: 2.5.3
  flutter_svg: 2.3.0

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 4.0.0

dependency_overrides:
  app_links: 6.2.0

flutter:
  uses-material-design: true

  assets:
    - assets/images/splash/rental_splash_background.png
    - assets/brand/mark.png
    - assets/images/categories/
    - assets/icons/categories/
    - assets/raw-file-property-inquire/westayplace-viewing-assets/icons/svg/

  shaders:
    - shaders/panorama.frag
