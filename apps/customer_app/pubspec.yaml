name: customer_app
description: "Rental Platform — Customer app. Discover, tour, book, apply."
publish_to: 'none'
version: 0.1.0+1

# TOOLCHAIN IS PINNED ON PURPOSE.
#
# Built and verified against Flutter 3.24.5 / Dart 3.5.4 (stable, 2024-11-13).
# See docs/06-frontend/flutter-toolchain.md before changing anything here.
#
# Every dependency below is pinned to an EXACT version, with no caret. Packages
# published after this Flutter release commonly require Dart >= 3.6, and a
# caret range lets `pub get` resolve into one silently — which fails at compile
# time with an error that points at the package rather than at the range that
# chose it. Exact pins plus a committed pubspec.lock make that impossible.
#
# Upper-bounding the SDK to <3.6.0 is deliberate for the same reason: the app
# should refuse to build on a newer toolchain rather than build differently on
# one.
environment:
  sdk: ">=3.5.4 <3.6.0"
  flutter: ">=3.24.5 <3.25.0"

dependencies:
  flutter:
    sdk: flutter

  # State management. 2.5.1 is the last release in the 2.x line verified
  # against Dart 3.5; riverpod 3.x requires a newer SDK.
  flutter_riverpod: 2.5.1

  # Routing. 14.2.7 predates the go_router releases that raised the Dart
  # constraint above 3.5.
  go_router: 14.2.7

  # PHP currency and date formatting. 0.19.0 is the version Flutter 3.24.5's
  # own flutter_localizations pins; using anything else creates a conflict the
  # moment localization is added.
  intl: 0.19.0

  # HTTP client. 1.2.2 is the last release verified against Dart 3.5; newer
  # majors raise the SDK floor above this pinned toolchain.
  http: 1.2.2

  cupertino_icons: 1.0.8
  supabase_flutter: ^2.15.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: 4.0.0

flutter:
  uses-material-design: true
